[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"


[project]
name = "medrag"
version = "0.1.0"
description = "Multilingual Multimodal Medical Knowledge RAG System"
requires-python = ">=3.10,<3.13"
dependencies = []       # Backend and frontend dependencies: backend/requirements.txt.


# This file exists only to make
# `medrag` an installable/importable package (pip install -e . --no-deps).


[tool.setuptools.packages.find]
where = ["backend/src"]              # "look inside this folder for packages"

[tool.setuptools.package-dir]
"" = "backend/src"                  # "and treat that folder as the root" --> we donot have to write in 
                                    # this way --> import backend.src.medrag.retrieval --> instead we can 
                                    # write import medrag.retrieval

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-ra --strict-markers -m 'not integration and not live'"
markers = [
    "integration: needs docker compose services running (Qdrant/Neo4j/Postgres)",
    "live: calls paid external APIs (OpenAI); manual only",
]
