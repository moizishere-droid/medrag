<!doctype html>
<html><body>
<script>
// Credentials go only to the API configured by the trusted Streamlit parent.
const parentOrigin = document.referrer ? new URL(document.referrer).origin : window.location.origin;
let lastNonce;
function send(type, extra = {}) {
  window.parent.postMessage({isStreamlitMessage: true, type, ...extra}, parentOrigin);
}
window.addEventListener("message", async event => {
  if (event.source !== window.parent || event.origin !== parentOrigin ||
      !event.data || event.data.type !== "streamlit:render") return;
  const args = event.data.args;
  if (!args || typeof args.nonce !== "string" || !args.nonce || args.nonce.length > 128 || args.nonce === lastNonce) return;
  lastNonce = args.nonce;
  try {
    if (!["login", "register", "logout"].includes(args.action)) throw new Error("Invalid action");
    const api = new URL(args.api_url);
    const local = ["localhost", "127.0.0.1", "[::1]"].includes(api.hostname);
    if ((api.protocol !== "https:" && !(local && api.protocol === "http:")) || api.username || api.password || api.search || api.hash)
      throw new Error("Invalid API address");
    if (args.action !== "logout" && (!args.credentials || typeof args.credentials.username !== "string" ||
        typeof args.credentials.password !== "string" || args.credentials.username.length > 64 || args.credentials.password.length > 128))
      throw new Error("Invalid credentials");
    const result = await fetch(api.href.replace(/\/$/, "") + "/auth/" + args.action, {
      method: "POST", credentials: "include",
      headers: {"Content-Type": "application/json"},
      body: args.action === "logout" ? undefined : JSON.stringify(args.credentials)
    });
    const data = await result.json();
    if (!result.ok) {
      const error = typeof data.detail === "string" ? data.detail : "Use a valid username and a password of 12–128 characters.";
      send("streamlit:setComponentValue", {value: {error}, dataType: "json"});
      return;
    }
    send("streamlit:setComponentValue", {value: {ok: true}, dataType: "json"});
    setTimeout(() => window.parent.location.reload(), 150);
  } catch (error) {
    send("streamlit:setComponentValue", {value: {error: "Could not reach the sign-in service. Please try again."}, dataType: "json"});
  }
});
send("streamlit:componentReady", {apiVersion: 1});
send("streamlit:setFrameHeight", {height: 0});
</script>
</body></html>
