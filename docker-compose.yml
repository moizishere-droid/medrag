services:
  qdrant:
    image: qdrant/qdrant@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    container_name: medrag-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j@sha256:956faa5d14b6beaa629b80c718bfd389ec12064f97e276ed9a58b0c53b25a323
    container_name: medrag-neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/medragpassword
    volumes:
      - ./neo4j_data:/data

  postgres:
    image: postgres@sha256:0f989d656f95dda60a631c8e1c67287df49b31a73f147e4290d5924fdc7f46e3
    container_name: medrag-postgres
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_USER=medrag
      - POSTGRES_PASSWORD=medragpassword
      - POSTGRES_DB=medrag_chat
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

volumes:
  qdrant_data:
