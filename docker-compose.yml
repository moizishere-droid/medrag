services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: medrag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:latest
    container_name: medrag-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/medragpassword
    volumes:
      - ./neo4j_data:/data

  postgres:
    image: postgres:15
    container_name: medrag-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=medrag
      - POSTGRES_PASSWORD=medragpassword
      - POSTGRES_DB=medrag_chat
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

volumes:
  qdrant_data:
